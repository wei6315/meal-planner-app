<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HOME">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>HOME</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F7F5F0; --paper:#FFFEFB; --ink:#2B2A28; --sub:#8A857B; --line:#E4DFD4; --line2:#CFC9BC;
  --accent:#3A4E6B; --red:#C73E3A;
  --font:"PingFang TC","Hiragino Sans","Noto Sans TC","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.6 var(--font);letter-spacing:.03em;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 130px}
small{font-size:13px}

/* 色彩分類：只用在項目前面的細條 */
.k-牛{--kd:#C73E3A}.k-豬{--kd:#D4789A}.k-雞{--kd:#E39A2D}.k-海鮮{--kd:#3F78B5}.k-蛋{--kd:#E5C23A}
.k-豆腐{--kd:#A9896A}.k-蔬菜{--kd:#6E9F5B}.k-湯{--kd:#5FA3AD}.k-甜湯{--kd:#9A7FB5}.k-一鍋{--kd:#4C5A8C}
.dot{display:inline-block;width:3px;height:12px;background:var(--kd);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0;color:var(--sub);font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* 標題與按鈕 */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:16px 0 8px}
.top h1{margin:0;font-size:34px;line-height:1.2;font-weight:300;letter-spacing:.16em}
.plus{width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);background:none;font-size:24px;font-weight:300;line-height:1;padding:0 0 2px}
.btn{border:1px solid var(--ink);background:none;border-radius:2px;padding:11px 16px;letter-spacing:.08em}
.btn.primary{background:var(--ink);color:#fff}
.btn.wide{width:100%}
.btn:active{opacity:.6}
.bar{display:flex;gap:10px;margin:0 0 10px}
.bar .btn{flex:1}
.note{margin:6px 0;color:var(--sub);font-size:14px}
.warn{color:var(--red)}
.card{background:none;padding:14px 0;margin:0;border-top:1px solid var(--line)}
.h2{margin:26px 0 4px;font-size:14px;color:var(--sub);letter-spacing:.14em}

/* 週次切換 */
.wnav{display:flex;align-items:center;justify-content:center;gap:4px;margin:0 0 8px}
.wnav b{min-width:150px;text-align:center;font-weight:400;font-size:20px;letter-spacing:.1em}
.wnav button{width:44px;height:34px;border:0;background:none;color:var(--sub);font-size:28px;font-weight:300;line-height:1}
.bar.slim .btn{padding:9px 14px;font-size:18px}
.bar.slim .btn.primary{flex:1}

/* 本週菜單 */
.wk{margin-top:4px}
.wr{display:grid;grid-template-columns:54px repeat(4,minmax(0,1fr));gap:5px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.wr.hd{border-top:0;border-bottom:0;padding:4px 0 6px;font-size:12px;color:var(--sub);letter-spacing:.14em}
.wr.hd span{padding-left:10px}
.wr.hd span:first-child{padding:0}
.dc{background:none;border:0;padding:0;text-align:left;line-height:1.35;display:flex;flex-direction:column;gap:1px}
.dc b{font-size:16px;font-weight:500}
.dc .d1{font-size:12px;color:var(--sub)}
.dc .d2{font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.dc .d2 b{font-size:12px;font-weight:600}
.sq{display:inline-grid;place-items:center;min-width:16px;height:16px;border:1px solid var(--ink);border-radius:2px;font-size:12px;line-height:1}
.dc .ok{color:#5E8E55;margin-left:3px;font-weight:600}
.dc .wn{color:#C27A1A;margin-left:3px;font-weight:600}
.dc .no{color:var(--red)}
.wc{display:flex;flex-direction:column;gap:5px;min-width:0}
.wc.span{grid-column:2/-1}
.dish{display:block;width:100%;background:none;border:0;border-left:3px solid var(--kd);border-radius:0;padding:1px 0 1px 6px;text-align:left;font-size:14px;line-height:1.4;font-weight:400;color:var(--ink);overflow-wrap:anywhere}
.dish:active{opacity:.55}
.bf{font-style:normal;font-size:12px;font-weight:700;color:var(--red);margin-right:3px}
.em{grid-column:2/-1;color:var(--sub);font-size:14px;padding-left:2px}

/* 班別 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{text-align:center;font-size:13px;color:var(--sub);padding:2px 0 4px}
.cal .c{border:0;border-radius:2px;background:var(--paper);min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.cal .c.out{opacity:.4}
.cal .c b{font-weight:400;font-size:14px;color:var(--sub);min-width:20px;height:20px;display:grid;place-items:center;border-radius:10px}
.cal .c b.today{background:var(--ink);color:#fff}
.cal .c span{font-size:18px;font-weight:500}
.cal .c.s-早{background:#F4EAC6}.cal .c.s-中{background:#F2D8D3}.cal .c.s-夜{background:#D9E3EC}.cal .c.s-休假{background:var(--paper)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.range .full{grid-column:1/-1}
.range label{font-size:14px;color:var(--sub)}
.inp{display:block;width:100%;margin-top:4px;padding:8px 0;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:none;font-size:20px;color:var(--ink)}
textarea.inp{border:1px solid var(--line2);padding:8px;border-radius:2px}

/* 食譜 */
.search{position:relative;margin:0 0 6px}
.search svg{position:absolute;left:0;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--sub);fill:none;stroke-width:1.5;stroke-linecap:round}
#q{width:100%;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:none;padding:9px 0 9px 26px;font-size:20px}
.pills{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:6px 0 16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:0;border-bottom:1px solid transparent;border-radius:0;background:none;padding:4px 0;color:var(--sub);white-space:nowrap}
.pill small{margin-left:4px}
.pill[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--paper);border:1px solid var(--line2);border-left:3px solid var(--kd);border-radius:2px;padding:6px 12px 6px 9px;font-size:18px;color:var(--ink);text-align:left}
.tile small{margin-left:6px;color:var(--sub)}
.tile.off{border-style:dashed;border-left-style:solid;opacity:.5}
.tile:active{background:var(--bg)}
.empty{margin:28px 2px;color:var(--sub)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:22px;border-radius:11px;background:var(--line2);position:relative;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--ink)}
#fBeef:checked{background:var(--red)}
.sw input:checked::after{transform:translateX(18px)}
.logout{display:block;width:100%;margin-top:22px;border:0;border-top:1px solid var(--line);background:none;color:var(--sub);padding:16px;letter-spacing:.1em}

/* 底部導覽 */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(247,245,240,.94);border-top:1px solid var(--line);padding:7px 0 calc(7px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;letter-spacing:.1em;color:var(--sub);padding:2px 0}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current=page]{color:var(--ink)}

/* 面板 */
dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:0;background:var(--bg);color:var(--ink);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(43,42,40,.35)}
dialog[open]{animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 20px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.sh h2{margin:0;font-size:19px;font-weight:500;text-align:center;flex:1;letter-spacing:.1em}
.sh button{background:none;border:0;color:var(--accent);font-size:19px;padding:4px 0;min-width:56px}
.sh button:first-child{text-align:left}.sh button:last-child{text-align:right}
.sh .go{font-weight:600}
.sbody{padding:6px 20px calc(24px + env(safe-area-inset-bottom))}
.grp{padding:14px 0;border-bottom:1px solid var(--line)}
.lab{display:block;font-size:14px;color:var(--sub);margin-bottom:6px;letter-spacing:.1em}
.grp .note{margin:8px 0 0}
.row2{display:grid;grid-template-columns:1fr;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:none;border-radius:2px;padding:5px 12px}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:2px;padding:2px 2px 2px 9px}
.tag button{border:0;background:none;padding:0 6px;font-size:20px;line-height:1;color:var(--sub)}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sug button{border:1px dashed var(--line2);background:none;border-radius:2px;padding:1px 9px;color:var(--sub);font-size:16px}
.err{margin:12px 0 0;color:var(--red)}
.dng{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 0;text-align:left;font-size:19px}
.dng.red{color:var(--red)}
#dangerZone{padding-top:10px}
.opts{max-height:60vh;overflow:auto}
.opts button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:15px 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
.opts small{margin-left:auto;color:var(--sub)}
.opts small.red{margin-left:0;color:var(--red)}
.opts .askmsg{margin:12px 0 6px;white-space:pre-line;line-height:1.7;color:var(--sub);font-size:16px}
.opts .okbtn{justify-content:center;margin-top:12px;background:var(--ink);color:#fff;border:0;border-radius:2px;padding:13px;letter-spacing:.1em}
.opts .okbtn.danger{background:var(--red)}
.opts textarea{width:100%;min-height:200px;padding:10px;border:1px solid var(--line2);border-radius:2px;background:var(--paper)}
button:disabled{opacity:.45}

/* 登入 */
#login{max-width:420px;margin:0 auto;padding:16vh 24px 40px}
#login h1{font-size:34px;margin:0 0 6px;font-weight:300;letter-spacing:.16em}
#login p{margin:0 0 30px;color:var(--sub);font-size:16px}
.group{margin-bottom:18px}
.group input{display:block;width:100%;border:0;border-bottom:1px solid var(--line2);background:none;padding:13px 0;font-size:20px;border-radius:0}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:2px;max-width:88vw;z-index:20;font-size:16px;text-align:center;letter-spacing:.06em}
#toast.bad{background:var(--red)}
.demo{margin:14px 0 0;padding:8px 12px;border:1px dashed var(--line2);font-size:14px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}.sw input,.sw input::after{transition:none}}
/* 待買清單 */
.addrow{display:flex;gap:12px;align-items:flex-end;margin-bottom:12px}
.addrow .inp{margin-top:0;flex:1}
.addrow .btn{flex:none;padding:9px 18px}
.gh{display:flex;align-items:baseline;gap:8px;margin:22px 0 2px;font-size:14px;color:var(--sub);letter-spacing:.14em}
.it{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ck{width:22px;height:22px;flex:none;border:1px solid var(--line2);border-radius:50%;background:none;padding:0;position:relative}
.it.done .ck{background:var(--ink);border-color:var(--ink)}
.it.done .ck::after{content:"";position:absolute;left:6px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.in{flex:1;min-width:0;text-align:left;background:none;border:0;border-left:3px solid var(--kd);padding:0 0 0 9px;display:flex;flex-direction:column;line-height:1.4}
.in .nm{font-size:19px}
.in small{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.done .in{opacity:.4}
.it.done .nm{text-decoration:line-through}
.k-none{--kd:#CFC9BC}
.rm{flex:none;width:36px;height:36px;border:0;background:none;color:var(--sub);font-size:28px;font-weight:300;line-height:1;padding:0}
.rm:active{color:var(--red)}
#toast button{margin-left:14px;border:0;background:none;color:#fff;font:inherit;text-decoration:underline;padding:0}
.bar{align-items:stretch}
.ib{flex:none;width:46px;display:grid;place-items:center;padding:0;border:1px solid var(--ink);border-radius:2px;background:none;color:var(--ink)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.ib.warn{color:var(--red);border-color:var(--line2)}
.ib:active{opacity:.55}
.ib:disabled{color:var(--sub);opacity:.4}


/* ===== 家務與 Today ===== */
#pickBody .delrow{color:var(--red);display:flex;align-items:center;gap:8px}
#pickBody .delrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#pickBody .delrow small{margin-left:auto}
.subnav{padding:0 0 12px}
.sech{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px;min-height:34px}
.sech h2{margin:0;font-size:21px;font-weight:600;letter-spacing:.08em}
.sech .meta{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:16px}
.sech .meta .over{color:var(--red)}
.tback{display:block;margin:-4px auto 6px;border:0;background:none;color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.tonight{display:flex;flex-wrap:wrap;gap:8px}
.tonight .tile{cursor:default}
.tmeta{display:inline-flex;align-items:center;gap:6px;font-size:16px;color:var(--sub)}
.prog{height:2px;background:var(--line);margin:0 0 2px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.chit .in{border-left:0;padding-left:0}
.chit .mn{flex:none;font-size:13px;color:var(--sub);white-space:nowrap}
.chit .bd{display:inline-block;margin-right:6px;padding:0 5px;border:1px solid var(--line2);border-radius:2px;font-size:12px}
.plus.open{transform:rotate(45deg)}
.plus{transition:transform .15s}
.chform{display:grid;gap:12px;margin:6px 0 14px;padding:14px;background:var(--paper);border:1px solid var(--line)}
.chform label{font-size:14px;color:var(--sub)}
.chform .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chform .acts{display:flex;gap:10px;justify-content:flex-end}
.chform .acts .btn{padding:9px 16px;font-size:18px}
.cw{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;align-items:center}
.cw .dc .d2{color:var(--sub)}
.cw.now .dc b{text-decoration:underline;text-underline-offset:4px}
.cl{display:flex;flex-direction:column;gap:3px;font-size:16px}
.cl span{display:flex;justify-content:space-between;padding-left:8px;border-left:3px solid var(--line)}
.cl span small{color:var(--sub)}
.cl .emp{border:0;padding:0;color:var(--sub)}
.ahd{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line2);font-size:19px;font-weight:600;letter-spacing:.06em}
.ahd small{font-weight:400;color:var(--sub)}
.lr{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}
.lr .n{flex:1;font-size:18px}
.lr .f{font-size:13px;color:var(--sub);text-align:right;line-height:1.45}
.lr .rm{font-size:24px}
</style>
</head>
<body>

<main id="login" hidden>
  <h1>晚餐菜單庫</h1>
  <p>登入後管理菜單與班別</p>
  <form id="loginForm">
    <div class="group">
      <input id="lEmail" type="email" placeholder="Email" aria-label="Email" autocomplete="username" required>
      <input id="lPass" type="password" placeholder="密碼" aria-label="密碼" autocomplete="current-password" required>
    </div>
    <p id="lErr" class="err" role="alert" hidden></p>
    <button type="submit" id="lBtn" class="btn primary wide">登入</button>
  </form>
</main>

<div id="app" class="wrap" hidden>
  
  <header class="top"><h1 id="pageTitle">Today</h1><button id="add" class="plus" type="button" aria-label="新增食譜" hidden>＋</button></header>

  <section id="vToday" hidden>
    <div class="wnav"><button id="tPrev" type="button" aria-label="前一天">‹</button><b id="tLabel"></b><button id="tNext" type="button" aria-label="後一天">›</button></div>
    <button id="tBack" class="tback" type="button" hidden>回到今天</button>
    <div class="sech"><h2>Tonight</h2><span id="tMeta" class="tmeta"></span></div>
    <div id="tMeal" class="tonight"></div>
    <div class="sech"><h2>Chores</h2><span class="meta"><span id="tLeft"></span><button id="tAdd" class="plus" type="button" aria-label="增加今天的項目">＋</button></span></div>
    <div id="tForm"></div>
    <div id="tChores"></div>
  </section>

  <section id="vChores" hidden>
    <nav class="pills subnav" aria-label="家務頁籤"><button type="button" class="pill" data-cs="week">本週</button><button type="button" class="pill" data-cs="lib">家務庫<small id="chCount"></small></button></nav>
    <div id="chBody"></div>
  </section>

  <section id="vMenu" hidden>
    <nav class="pills subnav" aria-label="菜單頁籤"><button type="button" class="pill" data-sv="menu" aria-selected="true">本週</button><button type="button" class="pill" data-sv="recipes">食譜</button></nav>
    <div class="wnav"><button id="wPrev" type="button" aria-label="上一週">‹</button><b id="weekLabel"></b><button id="wNext" type="button" aria-label="下一週">›</button></div>
    <div class="bar slim"><button id="gen" class="btn primary" type="button">排這週菜單</button><button id="copy" class="ib" type="button" aria-label="複製成文字" title="複製成文字"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg></button><button id="mClear" class="ib warn" type="button" aria-label="清空本週菜單" title="清空本週菜單"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l.8 11a2 2 0 0 0 2 1.8h4.4a2 2 0 0 0 2-1.8L17 7M10.5 11v5M13.5 11v5"/></svg></button></div>
    <p id="menuNote" class="note"></p>
    <div id="days" class="wk"></div>
    <p class="note">點菜名可更換；點日期可重排、確認或不排餐。</p>
    <div id="legMenu" class="legend"></div>
  </section>

  <section id="vShop" hidden>

<script>
const SUPABASE_URL = 'https://mnduxvbjpqstasdpmfcu.supabase.co';

const CATS = ['主菜','副菜','纖維質','湯','甜湯','一鍋懶人料理'];
const SLOT_ORDER = ['主菜','副菜','纖維質','湯','一鍋懶人料理','甜湯'];

const ABSENT = ['中'];            // 爸爸不在家吃晚餐的班別（只有這些日子才能排含牛的菜）

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 日期工具（一律用本機時間） ---------- */
const pad = n => String(n).padStart(2,'0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const isoWd = d => ((d.getDay()+6)%7)+1;
const dayDiff = (a,b) => Math.round((parse(a) - parse(b)) / 864e5);
const md = ds => `${+ds.slice(5,7)}/${+ds.slice(8,10)}`;

/* ---------- 全域狀態 ---------- */
let recipes = [], byId = {}, shiftSet = {}, weekdaySet = {}, catSet = {};
let view = 'menu', weekStart = mondayOf(new Date()), monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let wShifts = {}, wMeals = {}, wItems = [];
let tab = CATS[0], cur = null, tags = [], cat = CATS[0], rate = null, entered = false, tt, pickHandler = null;

function toast(msg, bad, action){

  if (action){
    const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label;

}

/* ---------- 登入 ---------- */
async function init(){

}

}

async function loadAll(){
  const rs = await Promise.all([
    db.from('recipes').select('*').order('name'),

  const bad = rs.find(x => x.error);
  if (bad){ toast('讀取失敗：' + bad.error.message, true); return; }
  recipes = rs[0].data; byId = Object.fromEntries(recipes.map(r => [r.id, r]));
  shiftSet = Object.fromEntries(rs[1].data.map(x => [x.shift, x]));
  weekdaySet = Object.fromEntries(rs[2].data.map(x => [x.weekday, x.day_type]));
  catSet = Object.fromEntries(rs[3].data.map(x => [x.category, x.repeat_window_days]));
  await chLoad();
  show('today');
}

/* ---------- 頁面切換 ---------- */
const TITLES = { today:'Today', menu:'Menu', chores:'Chores', shop:'Shopping', shift:'Shift', recipes:'Menu' };
async function show(v){
  view = v;
  $('vToday').hidden = v !== 'today'; $('vChores').hidden = v !== 'chores';
  $('vMenu').hidden = v !== 'menu'; $('vShop').hidden = v !== 'shop'; $('vShift').hidden = v !== 'shift'; $('vRecipes').hidden = v !== 'recipes';
  const tabV = v === 'recipes' ? 'menu' : v;
  $('add').hidden = v !== 'recipes';
  $('pageTitle').textContent = TITLES[v];

  if (v === 'today') await renderToday();
  if (v === 'chores') await renderChores();
  if (v === 'menu') await renderMenu();

}

/* ---------- 通用選單面板 ---------- */
function openPick(title, html, handler){
  $('pickTitle').textContent = title; $('pickBody').innerHTML = html; pickHandler = handler;
  if (!$('pick').open) $('pick').showModal();
}
const closePick = () => { if ($('pick').open) $('pick').close(); };
$('pickBody').addEventListener('click', e => { const b = e.target.closest('button'); if (b && pickHandler) pickHandler(b); });
$('pickClose').addEventListener('click', closePick);
// 頁內確認視窗：回傳 true（按確定）或 false（關閉）
const ask = (title, msg, ok = '確定', danger = false) => new Promise(res => {
  let yes = false;
  openPick(title, `<p class="askmsg">${esc(msg)}</p><button type="button" class="okbtn${danger ? ' danger' : ''}">${esc(ok)}</button>`, () => { yes = true; closePick(); });
  const onClose = () => { if ($('pick').open) return; $('pick').removeEventListener('close', onClose); res(yes); };
  $('pick').addEventListener('close', onClose);
});
$('pick').addEventListener('click', e => { if (e.target === $('pick')) closePick(); });

/* =====================================================
   排菜引擎（純函式；之後可原封不動搬到雲端函式）
   ===================================================== */
/*ENGINE_START*/
const addUse = (m, id, ds) => { if (!m.has(id)) m.set(id, []); m.get(id).push(ds); };
const dist = (uses, id, ds) => {
  let best = Infinity;
  for (const u of (uses.get(id) || [])) if (u !== ds) best = Math.min(best, Math.abs(dayDiff(u, ds)));
  return best;
};

// 從符合硬規則的食譜中挑一道；軟規則（重複窗口、食材重疊）用扣分處理，庫存不足時自動放寬
function choose(uses, ds, slot, beefOk, chosen, exclude){
  const egg = chosen.some(c => c.ingredients.includes('蛋'));
  const tagsUsed = new Set(chosen.flatMap(c => c.ingredients));
  const idsUsed = new Set(chosen.map(c => c.id));
  const win = catSet[slot];
  let best = null, bs = -1e9;
  for (const r of recipes){
    if (!r.active || r.category !== slot || idsUsed.has(r.id) || (exclude && exclude.has(r.id))) continue;
    if (r.has_beef && !beefOk) continue;                       // 硬規則：含牛只排爸爸不在家的日子
    if (egg && r.ingredients.includes('蛋')) continue;         // 硬規則：同一餐蛋類最多 1 道
    const dd = dist(uses, r.id, ds);
    let s = Math.min(dd, 60) + (r.kid_rating || 3) * 2 + Math.random() * 8;
    if (win != null ? dd < win : dd <= 1) s -= 100;            // 軟規則：重複窗口（副菜只避免連續兩天）
    s -= r.ingredients.filter(t => tagsUsed.has(t)).length * 25; // 軟規則：同餐食材不重疊
    if (beefOk && r.has_beef) s += 6;
    if (s > bs){ bs = s; best = r; }
  }
  return best;
}

function planDay(uses, ds, type, sh){
  const cfg = shiftSet[sh] || { headcount: 4, fiber_count: 2 };
  const beefOk = ABSENT.includes(sh);
  const slots = type === '一鍋'
    ? [['一鍋懶人料理', 1]]
    : [['主菜',1], ['副菜',1], ['湯',1], ...Array.from({ length: cfg.fiber_count }, (_, i) => ['纖維質', i+1])];
  const chosen = [], rows = [];
  for (const [slot, pos] of slots){
    const r = choose(uses, ds, slot, beefOk, chosen);
    if (r){ chosen.push(r); rows.push({ meal_date: ds, slot, position: pos, recipe_id: r.id }); addUse(uses, r.id, ds); }
  }
  return { headcount: cfg.headcount, rows, missing: slots.length - rows.length };
}
/*ENGINE_END*/

/* ---------- 本週菜單 ---------- */
const bySlot = (a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot) || a.position - b.position;

async function loadWeek(){
  const s = fmt(weekStart), e = fmt(addDays(weekStart, 6));
  const rs = await Promise.all([
    db.from('shifts').select('*').gte('shift_date', s).lte('shift_date', e),
    db.from('meals').select('*').gte('meal_date', s).lte('meal_date', e),
    db.from('meal_items').select('*').gte('meal_date', s).lte('meal_date', e)
  ]);
  const bad = rs.find(x => x.error);
  if (bad){ toast('讀取失敗：' + bad.error.message, true); return false; }
  wShifts = Object.fromEntries(rs[0].data.map(x => [x.shift_date, x]));
  wMeals = Object.fromEntries(rs[1].data.map(x => [x.meal_date, x]));
  wItems = rs[2].data;
  return true;
}
async function renderMenu(){ if (await loadWeek()) drawMenu(); }

const KINDS = ['牛','豬','雞','海鮮','蛋','豆腐','蔬菜','湯','甜湯','一鍋'];
const PROT = ['牛','豬','雞','海鮮','蛋','豆腐'];
// 依食材判斷顏色分類：牛 > 豬 > 雞 > 海鮮 > 蛋 > 豆腐，其餘依分類
function kindOf(r){
  if (!r) return '一鍋';
  const t = r.ingredients || [];
  if (r.has_beef || t.includes('牛')) return '牛';
  if (t.includes('豬')) return '豬';
  if (t.includes('雞')) return '雞';
  if (['魚','蝦','海鮮'].some(x => t.includes(x))) return '海鮮';
  if (t.includes('蛋')) return '蛋';
  if (t.includes('豆腐')) return '豆腐';
  return { '纖維質':'蔬菜', '湯':'湯', '甜湯':'甜湯' }[r.category] || '一鍋';
}
const legendHtml = ks => ks.map(k => `<span><i class="dot k-${k}"></i>${k}</span>`).join('');
function renderLegends(){ $('legMenu').innerHTML = legendHtml(KINDS.filter(k => k !== '甜湯')); $('legRec').innerHTML = legendHtml(KINDS); }
function dishChip(it){
  const r = byId[it.recipe_id], k = kindOf(r);
  return `<button type="button" class="dish k-${k}" data-item="${esc(it.id)}">${k === '牛' ? '<i class="bf">牛</i>' : ''}${esc(r ? r.name : '（已刪除）')}</button>`;
}

function weekRow(i){
  const d = addDays(weekStart, i), ds = fmt(d), m = wMeals[ds], sh = wShifts[ds] && wShifts[ds].shift, cfg = shiftSet[sh];
  const type = m ? m.day_type : weekdaySet[i+1];
  const its = wItems.filter(x => x.meal_date === ds).sort(bySlot);
  const hc = type === '公休' ? '' : (m && m.headcount ? m.headcount : (cfg ? cfg.headcount : 4));
  const flags = (m && m.status === '確認' ? '<span class="ok">✓</span>' : '') +
    (m && type !== '公休' && cfg && m.headcount !== cfg.headcount ? '<span class="wn">!</span>' : '');
  const l3 = sh ? `<span class="sq">${sh === '休假' ? '休' : esc(sh)}</span>${hc ? `<b>${hc}人</b>` : ''}` : '<span class="no">未輸入</span>';
  const dc = `<button type="button" class="dc" data-d="${ds}"><span><b>週${WD[d.getDay()]}</b>${flags}</span><span class="d1">${md(ds)}</span><span class="d2">${l3}</span></button>`;
  let cells;
  if (type === '公休') cells = `<div class="em">${m && m.status === '跳過' ? '不排餐' : '公休'}</div>`;
  else if (!its.length) cells = `<div class="em">尚未排餐</div>`;
  else if (type === '一鍋') cells = `<div class="wc span">${its.map(dishChip).join('')}</div>`;
  else cells = ['主菜','副菜','纖維質','湯'].map(s => `<div class="wc">${its.filter(x => x.slot === s).map(dishChip).join('')}</div>`).join('');
  return `<div class="wr" data-d="${ds}">${dc}${cells}</div>`;
}

function drawMenu(){
  const e = addDays(weekStart, 6);
  $('weekLabel').textContent = `${weekStart.getMonth()+1}/${weekStart.getDate()} – ${e.getMonth()+1}/${e.getDate()}`;
  let noShift = 0;
  for (let i = 0; i < 7; i++){
    const ds = fmt(addDays(weekStart, i)), m = wMeals[ds];
    if ((m ? m.day_type : weekdaySet[i+1]) !== '公休' && !(wShifts[ds] && wShifts[ds].shift)) noShift++;
  }
  $('mClear').disabled = !Object.keys(wMeals).length;
  $('days').innerHTML = `<div class="wr hd"><span></span><span>主菜</span><span>副菜</span><span>纖維質</span><span>湯</span></div>` +
    Array.from({ length: 7 }, (_, i) => weekRow(i)).join('');
  $('menuNote').innerHTML = noShift ? `<span class="warn">${noShift} 天尚未輸入班別</span>，先以 4 人、不含牛排。請到「爸爸班別」輸入。` : '';
}

$('mClear').addEventListener('click', async () => {
  const days = Object.keys(wMeals); if (!days.length) return toast('本週沒有菜單可以清空');
  if (!(await ask('清空本週菜單？', `會移除這週已排的 ${wItems.length} 道菜，包含已確認的日子，也會取消「不排餐」與改排的設定，全部回到預設。`, '清空', true))) return;
  const bm = Object.values(wMeals).map(m => ({ meal_date: m.meal_date, day_type: m.day_type, headcount: m.headcount, status: m.status, notes: m.notes ?? null }));

async function generate(only, force, overrides){
  const targets = [];
  for (let i = 0; i < 7; i++){
    const ds = fmt(addDays(weekStart, i)), m = wMeals[ds];
    if (only && !only.includes(ds)) continue;
    if (!force && m && ['確認','已煮','跳過'].includes(m.status)) continue;
    targets.push(ds);
  }
  if (!targets.length) return toast('沒有需要排的日子（已確認或不排餐的日子會保留）');
  $('gen').disabled = true;
  try {
    const h = await db.from('meal_items').select('meal_date,recipe_id')
      .gte('meal_date', fmt(addDays(weekStart, -35))).lte('meal_date', fmt(addDays(weekStart, 41)));
    if (h.error) return toast('讀取歷史菜單失敗：' + h.error.message, true);
    const uses = new Map();
    h.data.filter(x => !targets.includes(x.meal_date)).forEach(x => addUse(uses, x.recipe_id, x.meal_date));
    const mealRows = [], itemRows = []; let missing = 0, unknownShift = 0;
    for (const ds of targets){
      const m0 = wMeals[ds], sh = wShifts[ds] && wShifts[ds].shift;
      const type = (overrides && overrides[ds]) || (m0 && (m0.day_type === '正餐' || m0.day_type === '一鍋') ? m0.day_type : weekdaySet[isoWd(parse(ds))]);
      if (type === '公休'){ mealRows.push({ meal_date: ds, day_type: '公休', headcount: null, status: '草稿' }); continue; }
      if (!sh) unknownShift++;
      const p = planDay(uses, ds, type, sh);
      missing += p.missing;
      mealRows.push({ meal_date: ds, day_type: type, headcount: p.headcount, status: '草稿' });
      itemRows.push(...p.rows);
    }
    let r = await db.from('meals').delete().in('meal_date', targets);
    if (!r.error) r = await db.from('meals').insert(mealRows);
    if (!r.error && itemRows.length) r = await db.from('meal_items').insert(itemRows);
    if (r.error) return toast('儲存菜單失敗：' + r.error.message, true);
    await renderMenu();
    toast(missing ? `已排好，但有 ${missing} 個位置找不到可用的食譜，請補充食譜。` : (unknownShift ? `已排好。有 ${unknownShift} 天沒有班別，先以 4 人排。` : '已排好本週菜單'), !!missing);
  } finally { $('gen').disabled = false; }
}

function dayMenu(ds){
  const d = parse(ds), wdType = weekdaySet[isoWd(d)], m = wMeals[ds], type = m ? m.day_type : wdType;
  const its = wItems.filter(x => x.meal_date === ds), has = its.length > 0;
  const sh = wShifts[ds] && wShifts[ds].shift, cfg = shiftSet[sh], skipped = m && m.status === '跳過';
  const info = [sh ? (sh === '休假' ? '休假' : sh + '班') : '班別未輸入',
    skipped ? '這天不排餐' : (type === '公休' ? '公休' : `${m && m.headcount ? m.headcount : (cfg ? cfg.headcount : 4)} 人 · ${type}`),
    m && m.status === '確認' ? '已確認' : '',
    type !== '公休' && type !== wdType ? `預設為${wdType}` : ''].filter(Boolean).join(' · ');
  // 每天都可以選「正餐」或「一鍋」；預設的排法（週三、週日一鍋，週六公休，其餘正餐）不變
  const opts = [['plan', '正餐'], ['plan', '一鍋']].map(([a, t]) => [a, t, (type === t && has ? '重排' : '排') + (t === '一鍋' ? '一鍋' : '正餐'), type === t && has]);
  if (has) opts.push(['lock', '', m && m.status === '確認' ? '取消確認' : '確認這天', false]);
  if (type !== '公休') opts.push(['skip', '', '不排餐', false]);
  openPick(`週${WD[d.getDay()]} ${md(ds)}`, `<p class="askmsg">${esc(info)}</p>` +
    opts.map(([a, t, l, cur]) => `<button data-a="${a}" data-t="${t}">${l}${cur ? '<small>目前</small>' : ''}</button>`).join(''),
    btn => { closePick(); dayAct(ds, btn.dataset.a, btn.dataset.t || undefined); });
}
async function dayAct(ds, act, t){
  const m = wMeals[ds];
  if (act === 'redo'){
    if (m && m.status === '確認' && !(await ask('重排這天？', '這天已確認，重排會覆蓋目前的菜。', '重排'))) return;
    return generate([ds], true);
  }
  if (act === 'unskip') return generate([ds], true);
  if (act === 'plan'){
    if (m && m.status === '確認' && !(await ask('重排這天？', '這天已確認，重排會覆蓋目前的菜。', '重排'))) return;
    return generate([ds], true, { [ds]: t });
  }
  if (act === 'lock'){
    const r = await db.from('meals').update({ status: m.status === '確認' ? '草稿' : '確認' }).eq('meal_date', ds);
    if (r.error) return toast('更新失敗：' + r.error.message, true);
    return renderMenu();
  }
  if (act === 'skip'){
    if (!(await ask('這天不排餐？', '例如外食、出遊。已排的菜會移除。', '不排餐'))) return;
    let r = await db.from('meals').delete().in('meal_date', [ds]);
    if (!r.error && weekdaySet[isoWd(parse(ds))] !== '公休') r = await db.from('meals').insert({ meal_date: ds, day_type: '公休', headcount: null, status: '跳過' });
    if (r.error) return toast('更新失敗：' + r.error.message, true);
    return renderMenu();
  }
}

async function swapSheet(itemId){
  const it = wItems.find(x => x.id === itemId); if (!it) return;
  const ds = it.meal_date, sh = wShifts[ds] && wShifts[ds].shift, beefOk = ABSENT.includes(sh);
  const h = await db.from('meal_items').select('id,meal_date,recipe_id')
    .gte('meal_date', fmt(addDays(parse(ds), -35))).lte('meal_date', fmt(addDays(parse(ds), 35)));
  if (h.error) return toast('讀取失敗：' + h.error.message, true);
  const uses = new Map();
  h.data.filter(x => x.id !== it.id).forEach(x => addUse(uses, x.recipe_id, x.meal_date));
  const others = wItems.filter(x => x.meal_date === ds && x.id !== it.id).map(x => byId[x.recipe_id]).filter(Boolean);
  const egg = others.some(r => r.ingredients.includes('蛋')), ids = new Set(others.map(r => r.id));
  // 手動更換：同分類的菜全部可選；不符合自動排菜規則的排在後面並註明原因
  const list = recipes
    .filter(r => r.active && r.category === it.slot && !ids.has(r.id))
    .map(r => ({ r, dd: dist(uses, r.id, ds), why: [!beefOk && r.has_beef ? '爸爸在家' : '', egg && r.ingredients.includes('蛋') ? '同餐已有蛋' : ''].filter(Boolean).join('・') }))
    .sort((a, b) => !!a.why - !!b.why || b.dd - a.dd || a.r.name.localeCompare(b.r.name, 'zh-Hant'));
  const canDel = it.slot === '纖維質';      // 纖維質可只煮一道
  const delBtn = canDel ? `<button data-r="__del" class="delrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><b>移除這道</b><small>這天只煮其他纖維質</small></button>` : '';
  const html = `<button data-r="__rand"><b>隨機換一道</b></button>` + delBtn + list.map(({ r, dd, why }) =>
    `<button data-r="${esc(r.id)}"><i class="dot k-${kindOf(r)}"></i>${esc(r.name)}${r.id === it.recipe_id ? '<small>目前</small>' : ''}${r.has_beef ? '<small class="red">含牛</small>' : ''}${why ? `<small class="red">${why}</small>` : ''}<small>${dd >= 60 ? '近期沒吃過' : dd + ' 天前後吃過'}</small></button>`).join('');
  openPick(`更換「${byId[it.recipe_id] ? byId[it.recipe_id].name : ''}」`, html, async btn => {
    let rid = btn.dataset.r;
    if (rid === '__del'){
      closePick();
      const r = await db.from('meal_items').delete().eq('id', it.id);
      if (r.error) return toast('移除失敗：' + r.error.message, true);
      wItems = wItems.filter(x => x.id !== it.id); drawMenu();
      const name = byId[it.recipe_id] ? byId[it.recipe_id].name : '';
      return toast(`已移除「${name}」`, false, { label: '復原', fn: async () => {
        const w = await db.from('meal_items').insert(it);
        if (w.error) return toast('復原失敗：' + w.error.message, true);
        wItems.push(it); drawMenu();
      } });
    }
    if (rid === '__rand'){
      const p = choose(uses, ds, it.slot, beefOk, others, new Set([it.recipe_id]));
      if (!p) return toast('沒有其他可換的食譜', true);
      rid = p.id;
    }
    closePick();
    const r = await db.from('meal_items').update({ recipe_id: rid }).eq('id', it.id);
    if (r.error) return toast('更換失敗：' + r.error.message, true);
    it.recipe_id = rid; drawMenu();
  });
}

async function renderShift(){
  const gs = mondayOf(monthStart), ge = addDays(gs, 41);
  $('monthLabel').textContent = `${monthStart.getFullYear()} 年 ${monthStart.getMonth()+1} 月`;
  const r = await db.from('shifts').select('*').gte('shift_date', fmt(gs)).lte('shift_date', fmt(ge));
  if (r.error) return toast('讀取失敗：' + r.error.message, true);
  const map = Object.fromEntries(r.data.map(x => [x.shift_date, x.shift]));
  const today = fmt(new Date());
  let h = ['一','二','三','四','五','六','日'].map(x => `<div class="h">${x}</div>`).join('');
  for (let i = 0; i < 42; i++){
    const d = addDays(gs, i), ds = fmt(d), sh = map[ds];
    h += `<button type="button" class="c${sh ? ' s-' + esc(sh) : ''}${d.getMonth() !== monthStart.getMonth() ? ' out' : ''}" data-d="${ds}"><b${ds === today ? ' class="today"' : ''}>${d.getDate()}</b><span>${sh ? esc(sh) : '·'}</span></button>`;
  }
  $('cal').innerHTML = h;
  if (!$('cycTo').value) $('cycTo').value = fmt(new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 0));
}

    : await db.from('shifts').delete().in('shift_date', dates);

$('rGo').addEventListener('click', async () => {
  const a = $('rFrom').value, b = $('rTo').value;
  if (!a || !b || a > b) return toast('請選擇正確的起訖日期', true);
  const n = dayDiff(b, a) + 1;
  if (n > 62) return toast('一次最多填 62 天', true);
  await saveShift(Array.from({ length: n }, (_, i) => fmt(addDays(parse(a), i))), $('rShift').value);
  toast(`已填入 ${n} 天`);
});
$('cycGo').addEventListener('click', async () => {
  const until = $('cycTo').value; if (!until) return toast('請選擇延伸到哪一天', true);
  const r = await db.from('shifts').select('*').order('shift_date', { ascending: false }).limit(14);
  if (r.error) return toast('讀取失敗：' + r.error.message, true);
  if (!r.data.length) return toast('請先輸入至少一段班別，再依循環延伸', true);
  const rows = [...r.data].reverse(), last = rows[rows.length - 1];
  if (until <= last.shift_date) return toast(`已輸入到 ${md(last.shift_date)}，請選更晚的日期`, true);
  let shift = last.shift, run = 1;
  for (let i = rows.length - 2; i >= 0; i--){
    if (rows[i].shift === shift && dayDiff(rows[i+1].shift_date, rows[i].shift_date) === 1) run++; else break;
  }
  let prevWork = shift !== '休假' ? shift : null;
  if (!prevWork) for (let i = rows.length - 1; i >= 0; i--) if (rows[i].shift !== '休假'){ prevWork = rows[i].shift; break; }
  if (!prevWork) return toast('找不到前一段上班班別，請先手動輸入一段早、中或夜', true);
  const NEXT = { '中':'早', '早':'夜', '夜':'中' }, REST = { '中':1, '早':2, '夜':2 };
  const out = []; let d = parse(last.shift_date);
  while (fmt(d) < until){
    d = addDays(d, 1);
    if (shift !== '休假'){ if (run < 5) run++; else { shift = '休假'; run = 1; } }
    else if (run < REST[prevWork]) run++;
    else { shift = NEXT[prevWork]; prevWork = shift; run = 1; }
    out.push({ shift_date: fmt(d), shift, source: '手動' });
  }
  const w = await db.from('shifts').upsert(out, { onConflict: 'shift_date' });
  if (w.error) return toast('儲存失敗：' + w.error.message, true);
  await renderShift(); toast(`已依循環填入 ${out.length} 天，請核對`);
});

async function saveRecipe(){

const SHOP_GROUPS = ['蔬菜','肉類','海鮮','蛋豆','乾貨調味','其他'];
let shop = [];
const SEAF = ['魚','蝦','鮭','鱸','鯖','石斑','蛤','花枝','透抽','海鮮','蚵'];
const EGGB = ['蛋','豆腐','豆干','豆皮','豆漿'];
const MEAT = ['豬','牛','雞','肉','排骨','培根','香腸','火腿'];
const VEGS = ['菜','瓜','蔥','薑','蒜','菇','筍','椒','茄','蘿蔔','馬鈴薯','地瓜','玉米','洋蔥','芹','韭','豆芽','南瓜','花椰','青花','番茄'];
const DRYS = ['醬','油','鹽','糖','醋','粉','米','麵','烏龍','海苔','紫菜','味噌','咖哩','胡椒','酒','高湯'];
function guessGroup(n){
  const has = a => a.some(k => n.includes(k));
  if (n.includes('奶')) return '其他';
  if (has(SEAF)) return '海鮮';
  if (has(EGGB)) return '蛋豆';
  if (has(MEAT)) return '肉類';
  if (has(VEGS)) return '蔬菜';
  if (has(DRYS)) return '乾貨調味';
  return '其他';
}
const tagGroup = t => ['豬','牛','雞'].includes(t) ? '肉類' : ['魚','蝦','海鮮'].includes(t) ? '海鮮' : ['蛋','豆腐'].includes(t) ? '蛋豆' : '蔬菜';
function shopKind(it){
  const n = it.name;
  if (n.includes('牛')) return '牛'; if (n.includes('豬')) return '豬'; if (n.includes('雞') && !n.includes('蛋')) return '雞';
  if (SEAF.some(k => n.includes(k))) return '海鮮'; if (n.includes('蛋')) return '蛋'; if (n.includes('豆腐')) return '豆腐';
  return it.grp === '蔬菜' ? '蔬菜' : 'none';
}

async function addShop(){
  const names = [...new Set($('sName').value.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean))];
  if (!names.length) return;
  const have = new Set(shop.filter(x => !x.done).map(x => x.name));

}

async function importShop(ws){

/* =====================================================
   家務（Today 與 Chores）
   ===================================================== */
const CH_ANCHOR = new Date(2026, 9, 5);     // 4 週循環的起點（第 1 循環第 1 週的週一）
const CH_LIMIT = 60;                         // 每天上限（分鐘）
// 各區輪值日：wd = 星期（1 一 … 5 五）；A / B = 4 週循環中的第幾週
const CH_SLOT = {
  '主臥':{wd:1,A:1,B:3}, '姊姊房間':{wd:2,A:1,B:3}, '客廳':{wd:3,A:1,B:3}, '弟弟房間':{wd:4,A:1,B:3}, '玄關':{wd:5,A:1,B:3},
  '廚房':{wd:1,A:2,B:4}, '餐廳':{wd:2,A:2,B:4}, '客衛':{wd:3,A:2,B:4}, '主臥廁所':{wd:4,A:2,B:4},
  '前陽台':{wd:5,A:2,B:2}, '後陽台':{wd:5,A:4,B:4}
};
const CH_AREAS = ['玄關','客廳','餐廳','廚房','主臥','姊姊房間','弟弟房間','主臥廁所','客衛','前陽台','後陽台'];
const CH_FREQ = { weekly:'每週', biweekly:'隔週', monthly:'每月', quarterly:'每季', halfyear:'每半年' };
const CH_MONTHS = [[1,7],[2,8],[3,9],[4,10],[5,11],[6,12]];
const chMod = (a, n) => ((a % n) + n) % n;
let chTasks = [], chErr = '', chSub = 'week', chWeek = mondayOf(new Date()), chLibForm = false;
let tDay = parse(fmt(new Date())), tDone = new Set(), tExtras = [], tForm = false, tMealData = null;

function chPos(d){
  const w = Math.floor(Math.round((parse(fmt(d)) - CH_ANCHOR) / 864e5) / 7);
  return { w: chMod(w, 4) + 1, c: chMod(Math.floor(w / 4), 3) };
}
function chHits(t, c, w, wd){
  if (wd === 6) return false;
  const s = CH_SLOT[t.area];
  if (t.freq === 'weekly') return t.wd === wd;
  if (!s || s.wd !== wd) return false;
  if (t.freq === 'biweekly') return w === s.A || w === s.B;
  if (t.freq === 'monthly') return w === s[t.v];
  if (t.freq === 'quarterly') return w === s[t.v] && c === t.c;
  return false;
}
const chLoadAt = (c, w, wd) => chTasks.reduce((a, t) => a + (chHits(t, c, w, wd) ? t.min : 0), 0);
const chWorst = (w, wd) => Math.max(...[0, 1, 2].map(c => chLoadAt(c, w, wd)));
const chHy = new Map();
function chHalfDay(t, y, m){            // 每半年項目：該月負荷最低的一天
  const k = `${t.id}|${y}|${m}|${chTasks.length}`;
  if (chHy.has(k)) return chHy.get(k);
  let best = null;
  for (let i = 1; i <= new Date(y, m, 0).getDate(); i++){
    const d = new Date(y, m - 1, i); if (d.getDay() === 6) continue;
    const p = chPos(d), l = chLoadAt(p.c, p.w, d.getDay());
    if (!best || l < best.l) best = { d, l };
  }
  chHy.set(k, fmt(best.d)); return fmt(best.d);
}
function chOn(d){
  if (d.getDay() === 6) return [];
  const p = chPos(d), wd = d.getDay(), ds = fmt(d);
  return chTasks.filter(t => t.freq === 'halfyear'
    ? (t.months || []).includes(d.getMonth() + 1) && chHalfDay(t, d.getFullYear(), d.getMonth() + 1) === ds
    : chHits(t, p.c, p.w, wd));
}
function chGroup(list){
  const g = {}; list.forEach(t => (g[t.area] = g[t.area] || []).push(t));
  return Object.entries(g).sort((a, b) => b[1].length - a[1].length);
}
function chPlace(t){                      // 新增時自動排進負荷最低的位置，回傳該日最高分鐘數
  const s = CH_SLOT[t.area];
  if (t.freq === 'weekly'){
    let best = null;
    [1, 2, 3, 4, 5, 0].forEach(wd => { const m = Math.max(...[1, 2, 3, 4].map(w => chWorst(w, wd))); if (!best || m < best.m) best = { m, wd }; });
    t.wd = best.wd; return best.m + t.min;
  }
  if (t.freq === 'biweekly') return Math.max(chWorst(s.A, s.wd), chWorst(s.B, s.wd)) + t.min;
  if (t.freq === 'monthly'){ const a = chWorst(s.A, s.wd), b = chWorst(s.B, s.wd); t.v = a <= b ? 'A' : 'B'; return Math.min(a, b) + t.min; }
  if (t.freq === 'quarterly'){
    let best = null;
    ['A', 'B'].forEach(v => [0, 1, 2].forEach(c => { const l = chLoadAt(c, s[v], s.wd); if (!best || l < best.l) best = { l, v, c }; }));
    t.v = best.v; t.c = best.c; return best.l + t.min;
  }
  return t.min;
}
function chWhere(t){
  const s = CH_SLOT[t.area];
  if (t.freq === 'weekly') return `每週${WD[t.wd]}`;
  if (t.freq === 'biweekly') return `第 ${s.A}、${s.B} 週週${WD[s.wd]}`;
  if (t.freq === 'monthly') return `第 ${s[t.v]} 週週${WD[s.wd]}`;
  if (t.freq === 'quarterly') return `第 ${t.c + 1} 循環第 ${s[t.v]} 週週${WD[s.wd]}`;
  return `${(t.months || []).join('、')} 月`;
}
const chMissing = msg => /chore|relation|schema cache|does not exist/i.test(msg || '');
const chSetupMsg = () => `<p class="empty">${chMissing(chErr) ? '還沒建立家務資料表。<br>請在 Supabase 的 SQL Editor 執行 04_chores.sql。' : '讀取家務失敗：' + esc(chErr)}</p>`;
async function chLoad(){
  const r = await db.from('chores').select('*');
  if (r.error){ chErr = r.error.message; chTasks = []; return false; }
  chErr = ''; chTasks = r.data; chHy.clear(); return true;

}
function drawToday(){
  const ds = fmt(tDay), { sh, m, items } = tMealData, cfg = shiftSet[sh];
  const type = m ? m.day_type : weekdaySet[isoWd(tDay)];
  const hc = type === '公休' ? '' : (m && m.headcount ? m.headcount : (cfg ? cfg.headcount : 4));

    : its.map(it => { const r = byId[it.recipe_id]; return `<span class="tile k-${kindOf(r)}">${esc(r ? r.name : '（已刪除）')}</span>`; }).join('');

  $('tAdd').classList.toggle('open', tForm);
  $('tForm').innerHTML = tForm ? tFormHtml() : '';
  if (tForm) tFormSync(true);
  if (chErr){ $('tLeft').textContent = ''; $('tChores').innerHTML = chSetupMsg(); return; }
  const list = chOn(tDay).map(t => ({ ...t, key: ds + '|' + t.id, done: tDone.has(ds + '|' + t.id) }))
    .concat(tExtras.map(x => ({ id: x.id, area: x.area, name: x.name, min: x.min, once: true, carry: x.log_date < ds ? x.log_date : null, key: 'x|' + x.id, done: x.done })));
  if (!list.length){ $('tLeft').textContent = ''; $('tChores').innerHTML = `<p class="note">${tDay.getDay() === 6 ? '週六不排家務' : '今天沒有家務'}</p>`; return; }
  const total = list.reduce((a, t) => a + t.min, 0), left = list.filter(t => !t.done).reduce((a, t) => a + t.min, 0), n = list.filter(t => t.done).length;
  $('tLeft').innerHTML = left ? `<span class="${total > CH_LIMIT ? 'over' : ''}">剩 ${left} 分</span>` : '全部完成';
  $('tChores').innerHTML = `<div class="prog"><i style="width:${n / list.length * 100}%"></i></div>` + chGroup(list).map(([a, ts]) =>
    `<div class="gh"><span>${esc(a)}</span></div>` + ts.map(t => {
      const bd = t.carry ? `順延 ${md(t.carry)}` : t.once ? '單次' : t.freq === 'quarterly' ? '季' : t.freq === 'halfyear' ? '半年' : '';
      return `<div class="it chit${t.done ? ' done' : ''}"><button type="button" class="ck" data-k="${esc(t.key)}" aria-pressed="${!!t.done}" aria-label="${t.done ? '取消完成' : '完成'}「${esc(t.name)}」"></button><button type="button" class="in" data-k="${esc(t.key)}"><span class="nm">${esc(t.name)}</span></button><small class="mn">${bd ? `<span class="bd">${esc(bd)}</span>` : ''}${t.min} 分</small></div>`;
    }).join('')).join('');
}
function tFormHtml(){
  return `<div class="chform">
    <label>區域<select id="tfArea" class="inp">${CH_AREAS.map(a => `<option>${a}</option>`).join('')}<option>其他</option></select></label>
    <label>項目<select id="tfPick" class="inp"></select></label>
    <label id="tfNameW" hidden><input id="tfName" class="inp" placeholder="輸入項目" autocomplete="off" aria-label="項目名稱"></label>
    <label>預估時間（分鐘）<input id="tfMin" class="inp" type="number" inputmode="numeric" min="5" step="5" value="15"></label>
    <div class="acts"><button type="button" class="btn" id="tfCancel">取消</button><button type="button" class="btn primary" id="tfSave">加入今天</button></div>
  </div>`;
}
function tFormSync(area){
  if (area) $('tfPick').innerHTML = chTasks.filter(t => t.area === $('tfArea').value).map(t => `<option value="${esc(t.id)}">${esc(t.name)}（${t.min} 分）</option>`).join('') + '<option value="">其他</option>';
  const t = chTasks.find(x => x.id === $('tfPick').value);
  $('tfNameW').hidden = !!t; if (t) $('tfMin').value = t.min;
}
$('tForm').addEventListener('change', e => { if (e.target.id === 'tfArea') tFormSync(true); if (e.target.id === 'tfPick') tFormSync(false); });
$('tForm').addEventListener('click', async e => {
  if (e.target.id === 'tfCancel'){ tForm = false; return drawToday(); }
  if (e.target.id !== 'tfSave') return;
  const lib = chTasks.find(x => x.id === $('tfPick').value);
  const name = lib ? lib.name : $('tfName').value.trim(), min = parseInt($('tfMin').value, 10);
  if (!name){ $('tfName').focus(); return toast('請輸入項目', true); }
  if (!(min > 0)) return toast('請輸入預估時間', true);
  e.target.disabled = true;
  const r = await db.from('chore_extras').insert({ log_date: fmt(tDay), area: $('tfArea').value, name, min }).select().single();
  e.target.disabled = false;
  if (r.error) return toast('新增失敗：' + r.error.message, true);
  tExtras.push(r.data); tForm = false; drawToday();
});
$('tAdd').addEventListener('click', () => { if (chErr) return toast('請先建立家務資料表', true); tForm = !tForm; drawToday(); });
$('tChores').addEventListener('click', async e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const key = b.dataset.k, ds = fmt(tDay);
  if (key.startsWith('x|')){
    const x = tExtras.find(y => y.id === key.slice(2)); if (!x) return;
    x.done = !x.done; drawToday();
    const r = await db.from('chore_extras').update({ done: x.done, done_at: x.done ? fmt(new Date()) : null }).eq('id', x.id);
    if (r.error){ x.done = !x.done; drawToday(); toast('更新失敗：' + r.error.message, true); }
    return;
  }
  const t = chTasks.find(y => ds + '|' + y.id === key); if (!t) return;
  const was = tDone.has(key);
  was ? tDone.delete(key) : tDone.add(key); drawToday();
  const r = was ? await db.from('chore_done').delete().eq('key', key)
    : await db.from('chore_done').insert({ key, log_date: ds, chore_id: t.id, name: t.name, area: t.area, min: t.min });
  if (r.error){ was ? tDone.add(key) : tDone.delete(key); drawToday(); toast('更新失敗：' + r.error.message, true); }
});
$('tPrev').addEventListener('click', () => { tDay = addDays(tDay, -1); tForm = false; renderToday(); });
$('tNext').addEventListener('click', () => { tDay = addDays(tDay, 1); tForm = false; renderToday(); });
$('tBack').addEventListener('click', () => { tDay = parse(fmt(new Date())); tForm = false; renderToday(); });

/* ---------- Chores ---------- */
async function renderChores(){
  document.querySelectorAll('[data-cs]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.cs === chSub)));
  $('chCount').textContent = chTasks.length ? chTasks.length : '';
  if (chErr && !(await chLoad())) return $('chBody').innerHTML = chSetupMsg();
  if (chSub === 'week') return drawChWeek();
  drawChLib();
}
async function drawChWeek(){
  const s = fmt(chWeek), e = fmt(addDays(chWeek, 6)), today = fmt(new Date());
  const r = await db.from('chore_extras').select('*').gte('log_date', s).lte('log_date', e);
  const ex = r.error ? [] : r.data;
  let h = `<div class="wnav"><button type="button" data-cw="-1" aria-label="上一週">‹</button><b>${md(s)} – ${md(e)}</b><button type="button" data-cw="1" aria-label="下一週">›</button></div>`;
  for (let i = 0; i < 7; i++){
    const d = addDays(chWeek, i), ds = fmt(d);
    const list = chOn(d).concat(ex.filter(x => x.log_date === ds));
    const tot = list.reduce((a, t) => a + t.min, 0);
    const body = !list.length ? `<span class="emp">${d.getDay() === 6 ? '公休' : '無'}</span>`
      : chGroup(list).map(([a, ts]) => `<span>${esc(a)}<small>${ts.length} 項</small></span>`).join('');
    h += `<button type="button" class="cw${ds === today ? ' now' : ''}" data-day="${ds}"><span class="dc"><b>週${WD[d.getDay()]}</b><span class="d1">${md(ds)}</span>${list.length ? `<span class="d2${tot > CH_LIMIT ? ' warn' : ''}">${tot}分</span>` : ''}</span><span class="cl">${body}</span></button>`;
  }
  $('chBody').innerHTML = h + '<p class="note">點日期可切換到該天的 Today。</p>';
}
function drawChLib(){
  let h = `<div class="sech" style="margin-top:4px"><span class="meta">共 ${chTasks.length} 項・新增會自動排進最空的日子</span><button id="chAdd" class="plus${chLibForm ? ' open' : ''}" type="button" aria-label="增加家務">＋</button></div>`;
  if (chLibForm) h += `<div class="chform">
    <label>區域<select id="lfArea" class="inp">${CH_AREAS.map(a => `<option>${a}</option>`).join('')}</select></label>
    <label>項目名稱<input id="lfName" class="inp" autocomplete="off"></label>
    <div class="two"><label>週期<select id="lfFreq" class="inp">${Object.entries(CH_FREQ).map(([k, v]) => `<option value="${k}"${k === 'monthly' ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
    <label>預估時間（分鐘）<input id="lfMin" class="inp" type="number" inputmode="numeric" min="5" step="5" value="15"></label></div>
    <label id="lfMonW" hidden>月份<select id="lfMon" class="inp">${CH_MONTHS.map((p, i) => `<option value="${i}">${p[0]}、${p[1]} 月</option>`).join('')}</select></label>
    <div class="acts"><button type="button" class="btn" id="lfCancel">取消</button><button type="button" class="btn primary" id="lfSave">加入</button></div></div>`;
  CH_AREAS.forEach(a => {
    const ts = chTasks.filter(t => t.area === a);
    h += `<div class="ahd">${a}<small>${ts.length} 項</small></div>` + ts.map(t =>
      `<div class="lr"><span class="n">${esc(t.name)}</span><span class="f">${CH_FREQ[t.freq]}・${t.min} 分<br>${chWhere(t)}</span><button type="button" class="rm" data-del="${esc(t.id)}" aria-label="刪減「${esc(t.name)}」">×</button></div>`).join('');
  });
  $('chBody').innerHTML = h;
}
$('vChores').addEventListener('click', async e => {
  const cs = e.target.closest('[data-cs]'); if (cs){ chSub = cs.dataset.cs; chLibForm = false; return renderChores(); }
  const cw = e.target.closest('[data-cw]'); if (cw){ chWeek = addDays(chWeek, 7 * +cw.dataset.cw); return drawChWeek(); }
  const day = e.target.closest('[data-day]'); if (day){ tDay = parse(day.dataset.day); window.scrollTo(0, 0); return show('today'); }
  if (e.target.closest('#chAdd')){ chLibForm = !chLibForm; return drawChLib(); }
  if (e.target.id === 'lfCancel'){ chLibForm = false; return drawChLib(); }
  if (e.target.id === 'lfSave'){
    const name = $('lfName').value.trim(), min = parseInt($('lfMin').value, 10), freq = $('lfFreq').value;
    if (!name){ $('lfName').focus(); return toast('請輸入項目名稱', true); }
    if (!(min > 0)) return toast('請輸入預估時間', true);
    const t = { id: 't' + Date.now().toString(36), area: $('lfArea').value, name, freq, min, wd: null, v: null, c: null, months: null };
    if (freq === 'halfyear') t.months = CH_MONTHS[+$('lfMon').value];
    const peak = chPlace(t);
    const r = await db.from('chores').insert(t);
    if (r.error) return toast('新增失敗：' + r.error.message, true);
    chTasks.push(t); chHy.clear(); chLibForm = false; drawChLib(); $('chCount').textContent = chTasks.length;
    return toast(peak > CH_LIMIT ? `已排入${chWhere(t)}，但該日將達 ${peak} 分鐘` : `已排入${chWhere(t)}`, peak > CH_LIMIT);
  }
  const del = e.target.closest('[data-del]');
  if (del){
    const t = chTasks.find(x => x.id === del.dataset.del); if (!t) return;
    if (!(await ask(`刪減「${t.name}」？`, `${t.area}・${CH_FREQ[t.freq]}。刪減後不再排進家務，已完成的紀錄保留。`, '刪減', true))) return;
    const r = await db.from('chores').delete().eq('id', t.id);
    if (r.error) return toast('刪減失敗：' + r.error.message, true);
    chTasks = chTasks.filter(x => x.id !== t.id); chHy.clear(); drawChLib(); $('chCount').textContent = chTasks.length;
    toast(`已刪減「${t.name}」`, false, { label: '復原', fn: async () => {
      const w = await db.from('chores').insert(t);
      if (w.error) return toast('復原失敗：' + w.error.message, true);
      chTasks.push(t); chHy.clear(); if (view === 'chores') drawChLib();
    } });
  }
});
$('vChores').addEventListener('change', e => { if (e.target.id === 'lfFreq') $('lfMonW').hidden = e.target.value !== 'halfyear'; });

renderLegends();
init();
</script>
</body>
</html>
